name: Daybook
options:
  bundleIdPrefix: app.trim
  developmentLanguage: cs
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  DaybookCore:
    path: Packages/DaybookCore
targets:
  Daybook:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: DaybookCore
    postBuildScripts:
      - name: Stamp build number
        script: '"$SRCROOT/scripts/stamp-build-number.sh"'
        # Input only: runs after the Info.plist is written; no output, so it runs on every build.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - DaybookAppTests
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        # From the build settings below (MARKETING_VERSION, CURRENT_PROJECT_VERSION, DAYBOOK_COMMIT).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DaybookCommit: $(DAYBOOK_COMMIT)
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: "Daybook zobrazuje a upravuje události z kalendářů, které máte v zařízení."
        UILaunchScreen: {}
        # Empty unless DAYBOOK_CLOUDKIT_CONTAINER is set: categories then stay on the device.
        DaybookCloudKitContainer: $(DAYBOOK_CLOUDKIT_CONTAINER)
        # Development or Production, as in the entitlements; the category store's file name follows it.
        DaybookCloudKitEnvironment: $(DAYBOOK_CLOUDKIT_ENVIRONMENT)
        # The app uses no encryption of its own (only the system's HTTPS through CloudKit).
        ITSAppUsesNonExemptEncryption: false
        # iCloud sync, step 4 of 4 (see docs/superpowers/plans/2026-11-17-m4-categories.md):
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trim.daybook
        # The version: set MARKETING_VERSION here by hand for a new release (tag v<version>, see
        # scripts/release.sh). Development builds are build 1 with no commit; release.sh and
        # build-local-mac.sh put in the UTC date and time of the build (scripts/build-number.sh) and the
        # short commit hash, and a Release build from Xcode still at 1 gets them from the build phase
        # "Stamp build number", so every archive has a new build number for App Store Connect.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        DAYBOOK_COMMIT: ""
        SWIFT_VERSION: "5.0"
        # Czech is the development language; English comes from App/Localizable.xcstrings and
        # App/InfoPlist.xcstrings. The compiler records every localizable string for the catalogs.
        SWIFT_EMIT_LOC_STRINGS: YES
        # Drawn by scripts/make-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # iCloud sync for categories is on (see "Turning on iCloud sync" in
        # docs/superpowers/plans/2026-11-17-m4-categories.md). To build without signing, empty the container
        # and swap the entitlement lines back to the unsigned ones.
        # 1. the team:
        DEVELOPMENT_TEAM: XZR6HSC88P
        # 2. the container, registered at developer.apple.com for the app id app.trim.daybook (iCloud and Push):
        DAYBOOK_CLOUDKIT_CONTAINER: iCloud.app.trim.daybook
        # The CloudKit environment (entitlement com.apple.developer.icloud-container-environment):
        # Development for Debug, Production for Release (TestFlight, App Store). A local Mac build that
        # should share data with TestFlight overrides it: scripts/build-mac-icloud.sh production.
        DAYBOOK_CLOUDKIT_ENVIRONMENT: Development
        # 3. the entitlements with iCloud (the Mac file keeps the sandbox and calendar access):
        # "CODE_SIGN_IDENTITY[sdk=macosx*]": "-" # unsigned build
        # "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Daybook.entitlements # unsigned build
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/DaybookCloud-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/DaybookCloud-iOS.entitlements
      configs:
        Release:
          DAYBOOK_CLOUDKIT_ENVIRONMENT: Production

  # The app's SwiftData category store, tested on the Mac without a host app or signing identity.
  # The few app files it needs are compiled into the test bundle.
  DaybookAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: AppTests
      - path: App/System/CategoryRecords.swift
      - path: App/System/SwiftDataCategoryStore.swift
      - path: App/System/CategoryContainer.swift
    dependencies:
      - package: DaybookCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.trim.daybookAppTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
